name: Validation

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: node scripts/validate-docs.mjs
      - run: node scripts/check-repository-safety.mjs
      - run: npm test
      - run: npm run build
      - name: Browser journeys
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
      - name: Compose file is valid
        run: |
          cp .env.example .env
          docker compose config --quiet
